name: Build Raptor OS Security Edition

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# Build artifacts go to workflow artifacts (pulled down and re-hosted on
# Internet Archive — ISOs are too large to live in GitHub Releases).
permissions:
  contents: read

concurrency:
  group: raptor-os-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ISO Image
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      ### Breadcrumb: plain `sudo lb build` (as this workflow used to run)
      ### short-circuits when a directory contains an executable `auto/build`
      ### script — live-build redirects into auto/build instead of building.
      ### This repo keeps its auto/ scripts at the repo root, so all config,
      ### clean and build steps here intentionally run in `build/`, where the
      ### committed live-build config (build/config/) lives and there is no
      ### auto/ directory to intercept anything.

      # Newer Ubuntu host kernels restrict unprivileged user namespaces, which
      # breaks debootstrap's chroot usage under /tmp.
      - name: Disable AppArmor restrictions for chroot
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      # Cache that only persists the apt .deb archives (cache/apt_archives),
      # not live-build STAGE snapshots. Stage snapshots (--cache-stages "") are
      # disabled because a snapshot saved at the end of a completed build
      # poisoned the next resume: apt-key aborted on "Couldn't create temporary
      # file /tmp/apt.conf.*", failing the very first chroot apt-get update.
      # Every run now bootstraps fresh; the only resume is inert .debs, so
      # builds are deterministic. Bumped to v7 to evict poisoned v6 stage
      # snapshots (an already-failing run saved one under the fresh v6 key and
      # the next run restored it, re-poisoning the chroot /tmp).
      - name: Cache live-build stages
        uses: actions/cache@v4
        with:
          path: build/cache
          key: raptor-security-lb-v7-${{ runner.os }}-${{ hashFiles('build/config/package-lists/*.list.chroot', 'build/config/hooks/*', 'auto/config') }}

      - name: Free Disk Space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY" || true
          df -h

      - name: Install Build Tools
        run: |
          # The ubuntu-24.04 runner image preconfigures its OWN Google-Chrome
          # apt repo (dl.google.com). Its index downloads are flaky (hash-sum
          # mismatches that hard-fail `apt-get update`), and nothing in this
          # build needs Chrome — drop that source up front so a mirror glitch
          # can't kill the run, and keep retries for the Debian mirrors.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.list.save
          sudo apt-get update -o Acquire::Retries=5 -o Acquire::http::Timeout=10
          sudo apt-get install -y -o Acquire::Retries=5 \
            live-build \
            debootstrap \
          debian-archive-keyring \
          squashfs-tools \
          xorriso \
          isolinux \
          syslinux \
          syslinux-common \
          syslinux-utils \
          grub-efi-amd64-bin \
          mtools \
          dosfstools \
          librsvg2-bin \
          rsync

      - name: Show Build Tool Versions
        run: |
          lb --version
          debootstrap --version

      # Runs from the repo root (validate.sh's paths are build/...-relative).
      # On PRs this is the "automatic code validation" the README promises.
      - name: Run Configuration Validation
        run: |
          set -e
          chmod +x build/scripts/validate.sh
          ./build/scripts/validate.sh

      # The Debian archive layout puts Contents files under .../dists/<suite>/
      # main/, but live-build on ubuntu-24.04 still looks for them directly
      # under .../dists/<suite>/. The Contents index lookup is used to infer
      # which packages belong to which sections, so without the extra "/main"
      # this step fails to find any section information.
      - name: Patch live-build Contents index lookup
        run: |
          set -e
          LB_FILE="/usr/lib/live/build/lb_chroot_linux-image"
          sudo sed -i \
            's#${LB_PARENT_MIRROR_CHROOT}/dists/${LB_PARENT_DISTRIBUTION}/Contents-${LB_ARCHITECTURES}\.gz#${LB_PARENT_MIRROR_CHROOT}/dists/${LB_PARENT_DISTRIBUTION}/main/Contents-${LB_ARCHITECTURES}.gz#g' \
            "$LB_FILE"
          sudo sed -i \
            's#${LB_MIRROR_CHROOT}/dists/${LB_DISTRIBUTION}/Contents-${LB_ARCHITECTURES}\.gz#${LB_MIRROR_CHROOT}/dists/${LB_DISTRIBUTION}/main/Contents-${LB_ARCHITECTURES}.gz#g' \
            "$LB_FILE"

      # Debian security suites are named "-security" (e.g. bookworm-security),
      # but bookworm's live-build still appends the legacy "/updates" suffix.
      # Without this, the security archive lookups in sources.list come out
      # 404, silently dropping security updates from the image.
      - name: Patch live-build security suite name
        run: |
          set -e
          LB_FILE="/usr/lib/live/build/lb_chroot_archives"
          sudo sed -i '/SECURITY/ s#/updates#-security#g' "$LB_FILE"
          grep -n "VOLATILE" "$LB_FILE" | grep -- "-updates" || echo "WARNING: expected VOLATILE lines not found — investigate before trusting this build"

      # live-build ships the isolinux template entries as SYMLINKS into
      # Ubuntu host paths (/usr/lib/ISOLINUX/isolinux.bin etc.). lb_binary_syslinux
      # copies that template into the Debian bookworm build chroot and
      # dereferences the links there, where they dangle — bookworm's syslinux
      # packages ship NO isolinux.bin at all (only /usr/lib/syslinux/modules/bios/).
      # Drop REAL syslinux 6.04 binaries taken from the runner into the template
      # instead of symlinks, so the chrooted copy is self-contained. All three
      # come from the same syslinux 6.04 build, keeping versions consistent.
      - name: Materialize live-build isolinux template files (real, not symlinks)
        run: |
          set -e
          THEME_DIR="/usr/share/live/build/bootloaders/isolinux"
          sudo rm -f "$THEME_DIR/isolinux.bin" "$THEME_DIR/ldlinux.c32" "$THEME_DIR/vesamenu.c32"
          sudo cp /usr/lib/ISOLINUX/isolinux.bin "$THEME_DIR/isolinux.bin"
          sudo cp /usr/lib/syslinux/modules/bios/ldlinux.c32 "$THEME_DIR/ldlinux.c32"
          sudo cp /usr/lib/syslinux/modules/bios/vesamenu.c32 "$THEME_DIR/vesamenu.c32"
          file "$THEME_DIR/isolinux.bin" "$THEME_DIR/ldlinux.c32" "$THEME_DIR/vesamenu.c32"

      # bookworm's live-build still calls the legacy `rsvg` binary, which modern
      # distros no longer ship. Its replacement `rsvg-convert` (librsvg2-bin,
      # added to the install list below) takes the same flags but needs `-o`.
      - name: Patch live-build rsvg invocation
        run: |
          set -e
          LB_FILE="/usr/lib/live/build/lb_binary_syslinux"
          sudo sed -i \
            's#rsvg --format png --height 480 --width 640 splash.svg splash.png#rsvg-convert --format png --height 480 --width 640 splash.svg -o splash.png#' \
            "$LB_FILE"
          sudo sed -i \
            's#rsvg --format png --height 480 --width 640 "${_TARGET}/splash.svg" "${_TARGET}/splash.png"#rsvg-convert --format png --height 480 --width 640 "${_TARGET}/splash.svg" -o "${_TARGET}/splash.png"#' \
            "$LB_FILE"

      # Applied to the same file the rsvg patch above already touched — safe to
      # combine: sed substitution doesn't shift line numbers, only insertion or
      # append does, and this step's line numbers are unaffected by the rsvg
      # patch's substitutions run just before it.
      - name: Patch live-build gfxboot bootlogo hack (Debian-mode no-op)
        run: |
          set -e
          LB_FILE="/usr/lib/live/build/lb_binary_syslinux"
          sudo sed -i \
            -e '365i if [ -e "${_TARGET}/bootlogo" ]; then' \
            -e '375a fi' \
            "$LB_FILE"
          sudo sh -n "$LB_FILE" && echo "patched script: valid sh syntax"

      # Removes the previous build tree but keeps cache/, then deletes the
      # generated top-level config variable files. Those files are what config/
      # stores after the last lb config; deleting them forces auto/config to
      # regenerate them fresh, so option changes in auto/config take effect.
      #
      # config/cache is deliberately included: `lb config noauto` (auto/config)
      # does NOT overwrite an existing config/cache, so a stale LB_CACHE_STAGES
      # from an older build silently re-enables stage snapshots even though
      # auto/config passes --cache-stages "". A restored stage snapshot is what
      # poisons the next build's chroot /tmp (apt-key: "Couldn't create
      # temporary file /tmp/apt.conf.*") — see cache/chroot comment below.
      # Deleting config/cache here makes --cache-stages "" genuinely take
      # effect every run.
      - name: Clean previous build artifacts (preserving cache)
        working-directory: build
        run: |
          sudo rm -rf chroot binary .build
          sudo rm -f config/bootstrap config/chroot config/binary config/common config/source config/cache
          echo "cache/ contents preserved:"
          du -sh cache 2>/dev/null || echo "cache/ is empty (first run, or nothing restored)"
          # live-build keeps its own full stage snapshots in cache/{bootstrap,
          # chroot,binary,source} and resumes from them on the next run. A
          # snapshot taken at the end of a completed build can leave /tmp in a
          # state where the very first apt-get update of the chroot stage fails
          # (apt-key: "Couldn't create temporary file /tmp/apt.conf.*"), and a
          # mid-failure snapshot poisons the NEXT run the same way — that is
          # exactly what this run died on. Stage caching is disabled anyway
          # (--cache-stages ""), but delete any pre-existing snapshots here so
          # a poisoned one can NEVER be restored, regardless of what flags or
          # stale config/cache slipped through. cache/apt_archives (inert .debs)
          # is the only thing kept.
          for d in bootstrap chroot binary source; do
            sudo rm -rf "cache/$d"
          done

      # The image must boot with systemd as PID 1. auto/config explicitly
      # sets --initsystem systemd (Ubuntu's live-build defaults Debian live
      # systems to sysvinit, which would make lb_chroot_live-packages try to
      # install the non-existent live-config-sysvinit). This step additionally
      # purges sysvinit packages from the lists and pins them out of reach so
      # neither the stage cache nor a deps change can pull them back in.
      - name: Hard-ban sysvinit and configure APT
        working-directory: build
        run: |
          set -e

          find config/package-lists/ -type f -name "*.list.chroot" -exec sed -i '/^sysvinit-core/d; /^live-config-sysvinit/d; /^initscripts/d; /^orphan-sysvinit-scripts/d' {} + || true

          mkdir -p config/archives
          cat <<-'EOF' > config/archives/anti-sysvinit.pref.chroot
          Package: sysvinit-core sysv-rc initscripts orphan-sysvinit-scripts live-config-sysvinit
          Pin: release *
          Pin-Priority: -1
          EOF

          # This repo's package list is raptor-security.list.chroot (not the
          # raptor-base.list.chroot of older Raptor projects) — inject the
          # systemd init packages into whichever list exists, so live-build's
          # live-packages stage selects live-config-systemd rather than
          # failing on the hard-banned live-config-sysvinit.
          LIST_FILE="config/package-lists/raptor-security.list.chroot"
          if [ -f "$LIST_FILE" ]; then
            grep -q "^systemd-sysv$" "$LIST_FILE" || sed -i '1i systemd-sysv\nlive-config-systemd' "$LIST_FILE"
          fi

          mkdir -p config/apt
          echo 'APT::Sandbox::User "root";' > config/apt/apt.conf

      # Defensive: a parent job may have exported a stale TMPDIR pointing at a
      # directory that does not exist on this runner, which would make apt and
      # debootstrap fail early with confusing ENOENT errors.
      - name: Ensure a clean, valid TMPDIR before building
        run: |
          unset TMPDIR
          echo "TMPDIR=/tmp" >> "$GITHUB_ENV"

      # auto/config is at the repo root (../auto/config) and regenerates
      # config/{bootstrap,chroot,binary,common,source} in build/ via
      # `lb config noauto ...` with the project's canonical option set.
      - name: Configure live-build
        working-directory: build
        run: |
          set -e
          chmod +x ../auto/config
          ../auto/config

      - name: Build ISO
        working-directory: build
        run: sudo lb build

      # Gate the artifact on the payload actually being in the image. The
      # squashfs is unpacked on the runner (squashfs-tools is installed above)
      # and the build FAILS if /usr/lib/raptor-security is absent — there is no
      # way to ship an ISO that silently lost its customization layer again.
      - name: Assert Raptor payload is packed into the image
        working-directory: build
        run: |
          set -e
          SQ="binary/live/filesystem.squashfs"
          [ -f "$SQ" ] || { echo "ERROR: $SQ not found"; ls -la binary/live/ 2>/dev/null; exit 1; }
          if ! unsquashfs -n -ll "$SQ" 2>/dev/null | grep -q 'raptor-firstboot'; then
            echo "ERROR: Raptor payload MISSING from the image — includes.chroot did not make it in."
            echo "Top of squashfs listing for reference:"
            unsquashfs -n -ll "$SQ" 2>/dev/null | head -20
            exit 1
          fi
          echo "payload OK: raptor-firstboot.sh is in the image"
          unsquashfs -n -ll "$SQ" 2>/dev/null | grep -c 'usr/lib/raptor-security' | sed 's/^/raptor-security paths: /'
          echo "panel config:"
          unsquashfs -n -ll "$SQ" 2>/dev/null | grep 'xfce4-panel.xml' || echo "WARNING: custom panel config absent (default XFCE panel used)"
          echo "system-wide (xdg) xfce defaults:"
          unsquashfs -n -ll "$SQ" 2>/dev/null | grep -E 'etc/xdg/xfce4/xfconf/xfce-perchannel-xml/(xfce4-panel|xfce4-desktop|xsettings)\.xml' || echo "WARNING: /etc/xdg xfce defaults absent — desktop may fall back to Debian defaults"
          echo "wallpaper:"
          unsquashfs -n -ll "$SQ" 2>/dev/null | grep 'backgrounds/raptor-dark.png' || echo "WARNING: custom wallpaper absent"
          echo "lightdm autologin:"
          unsquashfs -n -ll "$SQ" 2>/dev/null | grep 'lightdm.conf.d/80-raptor-autologin.conf' || echo "WARNING: lightdm autologin config absent"
          echo "boot report instrumentation:"
          unsquashfs -n -ll "$SQ" 2>/dev/null | grep -E 'raptor-boot-report(\.sh|\.desktop)' || echo "WARNING: boot report instrument not found"

      - name: Verify ISO
        working-directory: build
        run: |
          set -e
          ISO="$(find . -maxdepth 1 -type f -name '*.iso' -print -quit)"
          if [ -z "$ISO" ]; then
            echo "ERROR: live-build completed but no ISO was produced."
            exit 1
          fi
          echo "Raptor OS Security build succeeded (BIOS-only at this point):"
          ls -lh "$ISO"

      # live-build's isolinux path produces a BIOS-only ISO; UEFI firmware will
      # not even see it, so a separate El Torito EFI entry is appended via
      # xorriso with an EFI system partition image. Fallback logic keeps the
      # BIOS-only ISO if the rebuild verification fails.
      - name: Add UEFI boot support (BIOS boot untouched)
        working-directory: build
        run: |
          set -e

          ORIGINAL_ISO="$(find . -maxdepth 1 -type f -name '*.iso' -print -quit)"
          echo "Original BIOS-only ISO: $ORIGINAL_ISO"

          sudo chmod -R a+rwX binary "$ORIGINAL_ISO"

          mkdir -p efi-build

          # Live-build names the on-ISO initramfs /live/initrd.img (single
          # flavour) or /live/initrd.img-<kver> depending on version/config, and
          # a wrong name means the kernel boots with NO initramfs and panics
          # with "VFS: Unable to mount root fs on unknown-block(0,0)". Resolve
          # the real name here so grub.cfg always points at a file that exists.
          INITRD_NAME="$(ls binary/live/initrd.img* 2>/dev/null | sed 's#^binary/##' | head -1 || true)"
          if [ -z "$INITRD_NAME" ]; then
            echo "ERROR: no initramfs found under binary/live/ — the ISO would be unbootable" >&2
            ls -la binary/live/ 2>/dev/null || ls -la binary/ || true
            exit 1
          fi
          echo "Using initrd: /$INITRD_NAME"
          {
            printf '%s\n' 'insmod part_gpt'
            printf '%s\n' 'insmod part_msdos'
            printf '%s\n' 'insmod fat'
            printf '%s\n' 'insmod iso9660'
            printf '%s\n' 'insmod all_video'
            printf '%s\n' 'insmod gfxterm'
            printf '%s\n' 'insmod search'
            printf '%s\n' 'insmod search_fs_uuid'
            printf '%s\n' 'insmod search_label'
            printf '%s\n' 'insmod regexp'
            printf '\n'
            printf '%s\n' 'set default="0"'
            printf '%s\n' 'set timeout=5'
            printf '\n'
            printf '%s\n' 'search --no-floppy --set=root --label RAPTOR-SECURITY'
            printf '\n'
            printf '%s\n' 'menuentry "Raptor Security (Live)" {'
            printf '%s\n' '    linux /live/vmlinuz boot=live config components username=user autologin quiet ignore_uuid live-media-timeout=30'
            printf '%s\n' "    initrd /$INITRD_NAME"
            printf '%s\n' '}'
            printf '\n'
            printf '%s\n' 'menuentry "Raptor Security (Live, fail-safe)" {'
            printf '%s\n' '    linux /live/vmlinuz boot=live config components username=user autologin quiet ignore_uuid live-media-timeout=30 noapic noapm nodma nomce nolapic nosmp'
            printf '%s\n' "    initrd /$INITRD_NAME"
            printf '%s\n' '}'
          } > efi-build/grub.cfg

          grub-mkstandalone \
            --format=x86_64-efi \
            --output=efi-build/BOOTX64.EFI \
            --locales="" \
            --fonts="" \
            "boot/grub/grub.cfg=efi-build/grub.cfg"

          file efi-build/BOOTX64.EFI | grep -q "PE32+ executable" || {
            echo "ERROR: grub-mkstandalone did not produce a valid EFI executable"
            exit 1
          }

          mkdir -p efi-build/esp/EFI/BOOT
          cp efi-build/BOOTX64.EFI efi-build/esp/EFI/BOOT/BOOTX64.EFI
          dd if=/dev/zero of=efi-build/efiboot.img bs=1M count=16
          mkfs.vfat -F 16 -n "RAPTOR_EFI" efi-build/efiboot.img
          mmd -i efi-build/efiboot.img ::/EFI
          mmd -i efi-build/efiboot.img ::/EFI/BOOT
          mcopy -i efi-build/efiboot.img efi-build/BOOTX64.EFI ::/EFI/BOOT/BOOTX64.EFI

          mkdir -p binary/EFI/BOOT
          cp efi-build/BOOTX64.EFI binary/EFI/BOOT/BOOTX64.EFI

          cd binary
          xorriso -as mkisofs \
            -r -J -l -cache-inodes -allow-multidot \
            -A "Raptor Security" \
            -publisher "Raptor OS Project" \
            -V "RAPTOR-SECURITY" \
            -no-emul-boot -boot-load-size 4 -boot-info-table \
            -b isolinux/isolinux.bin -c isolinux/boot.cat \
            -eltorito-alt-boot \
            -e --interval:appended_partition_2:all:: \
            -no-emul-boot \
            -append_partition 2 0xef ../efi-build/efiboot.img \
            -isohybrid-gpt-basdat \
            -o "../${ORIGINAL_ISO}.uefi" \
            .
          cd ..

          ENTRY_COUNT=$(xorriso -indev "${ORIGINAL_ISO}.uefi" -report_el_torito plain 2>&1 | grep -c "El Torito boot img" || true)
          if [ "$ENTRY_COUNT" -lt 2 ]; then
            echo "ERROR: rebuilt ISO does not have both BIOS and UEFI boot entries."
            echo "Falling back to the original BIOS-only ISO — nothing is lost, UEFI just isn't added this run."
            rm -f "${ORIGINAL_ISO}.uefi"
          else
            echo "Confirmed: rebuilt ISO has both BIOS and UEFI boot entries."
            xorriso -indev "${ORIGINAL_ISO}.uefi" -report_el_torito plain 2>&1 | grep "El Torito boot img"
            mv "${ORIGINAL_ISO}.uefi" "$ORIGINAL_ISO"
          fi

      # live-build writes the image as binary.hybrid.iso regardless of
      # project naming; rename it to the product name + build date so the
      # debug artifact and any release upload carry a meaningful filename.
      - name: Rename ISO to product name
        working-directory: build
        run: |
          set -e
          ISO="$(find . -maxdepth 1 -type f -name '*.iso' -print -quit)"
          DATE="$(date -u +%Y%m%d)"
          FINAL="raptor-security-${DATE}.iso"
          mv "$ISO" "$FINAL"
          echo "Renamed to: $FINAL"
          ls -lh "$FINAL"

      - name: Compute checksum
        working-directory: build
        run: |
          set -e
          ISO="$(find . -maxdepth 1 -type f -name '*.iso' -print -quit)"
          echo "Final ISO:"
          ls -lh "$ISO"
          sha256sum "$ISO" > raptor-security.sha256
          cat raptor-security.sha256

      # The ISO is not published to GitHub Releases (too large): the build is
      # uploaded as a workflow artifact, and the actual release ISO is hosted
      # on Internet Archive, matching Raptor OS Home Edition.
      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: Raptor-OS-Security-ISO
          path: |
            build/*.iso
            build/raptor-security.sha256
          compression-level: 0
          retention-days: 30

      - name: Fix cache permissions for save
        if: always()
        run: sudo chmod -R a+rX build/cache 2>/dev/null || true