name: Build Raptor OS Security Update

# Unlike build-iso.yml (triggered by push/PR, workflow_dispatch, and v* tag
# pushes that publish to GitHub Releases), this one also runs weekly — Security
# Edition is a Live ISO people re-download and re-flash rather than an
# atomically updatable image like home edition's Bazzite base, so a scheduled
# rebuild is how it picks up upstream Debian package/security updates at all.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 0" # weekly, Sunday 05:00 UTC

permissions:
  contents: read

concurrency:
  group: raptor-security-update
  cancel-in-progress: true

jobs:
  update:
    name: Rebuild Raptor OS Security
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Ubuntu 24.04 (which this workflow runs on) ships an AppArmor policy
      # that restricts UNPRIVILEGED user namespaces. live-build's chroot
      # stages shell out to debootstrap, which needs one. With the restriction
      # active, the chroot stage dies immediately and the whole weekly update
      # build fails. build-iso.yml already carries this step; it was never
      # backported here, which is the single biggest reason the scheduled
      # update run kept failing while the push-triggered build worked.
      - name: Disable AppArmor restrictions for chroot
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      # Cache key includes the current ISO week — deliberately DIFFERENT
      # from build-iso.yml's permanent content-hash-only key. This
      # workflow's whole purpose is fetching fresh upstream Debian
      # updates on a schedule; a permanent cache key would silently
      # restore last week's packages forever and defeat that entirely.
      # A weekly-rotating key still speeds up same-week re-runs (e.g. a
      # manual retry after a transient network failure) without ever
      # skipping the actual weekly update check.
      - name: Get cache week
        id: cache-week
        run: echo "week=$(date +%Y-%U)" >> "$GITHUB_OUTPUT"

      - name: Cache live-build stages (weekly)
        uses: actions/cache@v4
        with:
          path: build/cache
          key: raptor-security-lb-update-${{ runner.os }}-${{ steps.cache-week.outputs.week }}-${{ hashFiles('build/config/package-lists/*.list.chroot', 'build/config/hooks/*', 'auto/config') }}
          restore-keys: |
            raptor-security-lb-update-${{ runner.os }}-${{ steps.cache-week.outputs.week }}-

      - name: Free disk space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY" || true
          df -h

      - name: Install build dependencies
        run: |
          # The ubuntu-24.04 runner image preconfigures its OWN Google-Chrome
          # apt repo (dl.google.com). Its index downloads are flaky (hash-sum
          # mismatches that hard-fail `apt-get update`), and nothing in this
          # build needs Chrome — drop that source up front so a mirror glitch
          # can't kill the run, and keep retries for the Debian mirrors.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.list.save
          sudo apt-get update -o Acquire::Retries=5 -o Acquire::http::Timeout=10
          sudo apt-get install -y -o Acquire::Retries=5 \
            live-build \
            debootstrap \
            debian-archive-keyring \
            squashfs-tools \
            xorriso \
            isolinux \
            syslinux \
            syslinux-common \
            syslinux-utils \
            grub-efi-amd64-bin \
            mtools \
            dosfstools \
            librsvg2-bin \
            rsync

          # The isolinux materialization step below copies ldlinux.c32 and
          # vesamenu.c32 out of the syslinux package. Fail loudly HERE if they
          # are missing, rather than letting the copy step fail with a bare
          # "No such file or directory" forty minutes into the build.
          for f in /usr/lib/ISOLINUX/isolinux.bin \
                   /usr/lib/syslinux/modules/bios/ldlinux.c32 \
                   /usr/lib/syslinux/modules/bios/vesamenu.c32; do
            [ -f "$f" ] || { echo "ERROR: required syslinux asset missing: $f"; exit 1; }
          done

      - name: Show build tool versions
        run: |
          lb --version
          debootstrap --version

      - name: Run configuration validation
        run: |
          set -e
          chmod +x build/scripts/validate.sh
          ./build/scripts/validate.sh

      # Same fix as build-iso.yml — see that workflow's comment for the
      # full explanation. Kept identical between the two workflows
      # deliberately, so there's exactly one place this ever needs
      # updating if the live-build package changes.
      - name: Patch live-build Contents index lookup
        run: |
          set -e
          LB_FILE="/usr/lib/live/build/lb_chroot_linux-image"
          sudo sed -i \
            's#${LB_PARENT_MIRROR_CHROOT}/dists/${LB_PARENT_DISTRIBUTION}/Contents-${LB_ARCHITECTURES}\.gz#${LB_PARENT_MIRROR_CHROOT}/dists/${LB_PARENT_DISTRIBUTION}/main/Contents-${LB_ARCHITECTURES}.gz#g' \
            "$LB_FILE"
          sudo sed -i \
            's#${LB_MIRROR_CHROOT}/dists/${LB_DISTRIBUTION}/Contents-${LB_ARCHITECTURES}\.gz#${LB_MIRROR_CHROOT}/dists/${LB_DISTRIBUTION}/main/Contents-${LB_ARCHITECTURES}.gz#g' \
            "$LB_FILE"

      # Same fix as build-iso.yml — see that workflow's comment for the
      # full explanation and how it was confirmed against a real failed run.
      - name: Patch live-build security suite name
        run: |
          set -e
          LB_FILE="/usr/lib/live/build/lb_chroot_archives"
          sudo sed -i '/SECURITY/ s#/updates#-security#g' "$LB_FILE"
          grep -n "VOLATILE" "$LB_FILE" | grep -- "-updates" || echo "WARNING: expected VOLATILE lines not found — investigate before trusting this build"

      # live-build ships the isolinux template entries as SYMLINKS into
      # Ubuntu host paths (/usr/lib/ISOLINUX/isolinux.bin etc.). lb_binary_syslinux
      # copies that template into the Debian bookworm build chroot and
      # dereferences the links there, where they dangle — bookworm's syslinux
      # packages ship NO isolinux.bin at all (only /usr/lib/syslinux/modules/bios/).
      # Drop REAL syslinux 6.04 binaries taken from the runner into the template
      # instead of symlinks, so the chrooted copy is self-contained. All three
      # come from the same syslinux 6.04 build, keeping versions consistent.
      #
      # This step previously re-pointed the symlinks (`ln -sf`) instead of
      # copying, and omitted ldlinux.c32 entirely — i.e. it was still the
      # pre-fix version while its comment claimed parity with build-iso.yml.
      # That is why the BIOS bootloader step of the weekly rebuild kept
      # failing while the push-triggered build worked.
      - name: Materialize live-build isolinux template files (real, not symlinks)
        run: |
          set -e
          THEME_DIR="/usr/share/live/build/bootloaders/isolinux"
          sudo rm -f "$THEME_DIR/isolinux.bin" "$THEME_DIR/ldlinux.c32" "$THEME_DIR/vesamenu.c32"
          sudo cp /usr/lib/ISOLINUX/isolinux.bin "$THEME_DIR/isolinux.bin"
          sudo cp /usr/lib/syslinux/modules/bios/ldlinux.c32 "$THEME_DIR/ldlinux.c32"
          sudo cp /usr/lib/syslinux/modules/bios/vesamenu.c32 "$THEME_DIR/vesamenu.c32"
          file "$THEME_DIR/isolinux.bin" "$THEME_DIR/ldlinux.c32" "$THEME_DIR/vesamenu.c32"

      # Same fix as build-iso.yml — see that workflow's comment for the
      # full explanation.
      - name: Patch live-build rsvg invocation
        run: |
          set -e
          LB_FILE="/usr/lib/live/build/lb_binary_syslinux"
          sudo sed -i \
            's#rsvg --format png --height 480 --width 640 splash.svg splash.png#rsvg-convert --format png --height 480 --width 640 splash.svg -o splash.png#' \
            "$LB_FILE"
          sudo sed -i \
            's#rsvg --format png --height 480 --width 640 "${_TARGET}/splash.svg" "${_TARGET}/splash.png"#rsvg-convert --format png --height 480 --width 640 "${_TARGET}/splash.svg" -o "${_TARGET}/splash.png"#' \
            "$LB_FILE"

      # Same fix as build-iso.yml — see that workflow's comment for the
      # full explanation. Applied to the same file the rsvg patch above
      # already touched — safe to combine, sed substitution doesn't
      # shift line numbers, only sed insertion/append does, and this
      # step's line numbers (365/375) are unaffected by the rsvg patch's
      # substitutions run just before it.
      - name: Patch live-build gfxboot bootlogo hack (Debian-mode no-op)
        run: |
          set -e
          LB_FILE="/usr/lib/live/build/lb_binary_syslinux"
          sudo sed -i \
            -e '365i if [ -e "${_TARGET}/bootlogo" ]; then' \
            -e '375a fi' \
            "$LB_FILE"
          sudo sh -n "$LB_FILE" && echo "patched script: valid sh syntax"

      - name: Clean previous build artifacts (preserving cache)
        working-directory: build
        run: |
          sudo rm -rf chroot binary .build
          sudo rm -f config/bootstrap config/chroot config/binary config/common config/source config/cache
          # Remove any ISO left over from an earlier run in this same working
          # tree. Everything downstream discovers the image with
          # `find . -maxdepth 1 -name '*.iso' -print -quit`, which returns an
          # ARBITRARY match when more than one is present — so a stale ISO
          # would let the whole pipeline "succeed" while shipping last week's
          # image with none of this week's security updates. This workflow
          # never renamed its output the way build-iso.yml does, which is
          # exactly how a second ISO could end up in the directory.
          find . -maxdepth 1 -type f \( -name '*.iso' -o -name '*.sha256' \) -delete
          echo "cache/ contents preserved:"
          du -sh cache 2>/dev/null || echo "cache/ is empty (first run this week, or nothing restored)"
          # Drop any pre-existing live-build stage snapshots so a poisoned one
          # (chroot /tmp breaks the first apt-get update: apt-key "Couldn't
          # create temporary file /tmp/apt.conf.*") can never be restored.
          # cache/apt_archives (inert .debs) is the only thing kept.
          for d in bootstrap chroot binary source; do
            sudo rm -rf "cache/$d"
          done

      # auto/config lives at the repo root; from build/ it is ../auto/config.
      - name: Configure live-build
        working-directory: build
        run: |
          set -e
          chmod +x ../auto/config
          ../auto/config

      # The image must boot with systemd as PID 1. Explicitly purge legacy
      # init packages from the lists and pin them out of reach so neither a
      # restored stage cache nor a dependency change can pull them back in.
      - name: Hard-ban sysvinit and configure APT
        working-directory: build
        run: |
          set -e

          # ASSERT auto/config still pins systemd rather than mutating it.
          # This step used to run `sed -i '/--systemd/d' ../auto/config`:
          # that was a no-op (auto/config says `--initsystem systemd`, which
          # does not contain the literal `--systemd`) that nonetheless edited
          # a version-controlled file on every run. It read like a safety
          # measure while doing nothing. Verify the real invariant instead —
          # if --initsystem ever gets dropped, live-build silently defaults
          # Debian-mode systems to sysvinit and then tries to install the
          # hard-banned live-config-sysvinit, failing the build much later
          # with a far less obvious error.
          grep -q -- '--initsystem systemd' ../auto/config || {
            echo "ERROR: auto/config no longer pins '--initsystem systemd'."
            echo "Debian-mode live-build would fall back to sysvinit."
            exit 1
          }

          find config/package-lists/ -type f -name "*.list.chroot" -exec sed -i '/^sysvinit-core/d; /^live-config-sysvinit/d; /^initscripts/d; /^orphan-sysvinit-scripts/d' {} + || true

          mkdir -p config/archives
          cat <<-'EOF' > config/archives/anti-sysvinit.pref.chroot
          Package: sysvinit-core sysv-rc initscripts orphan-sysvinit-scripts live-config-sysvinit
          Pin: release *
          Pin-Priority: -1
          EOF

          LIST_FILE="config/package-lists/raptor-security.list.chroot"
          if [ -f "$LIST_FILE" ]; then
            grep -q "^systemd-sysv$" "$LIST_FILE" || sed -i '1i systemd-sysv\nlive-config-systemd' "$LIST_FILE"
          fi

          mkdir -p config/apt
          echo 'APT::Sandbox::User "root";' > config/apt/apt.conf

      # Same defensive fix as build-iso.yml — see that workflow's comment for
      # the full explanation and the honest confidence level (this one is
      # unverified, unlike everything else in these workflows).
      - name: Ensure a clean, valid TMPDIR before building
        run: |
          unset TMPDIR
          echo "TMPDIR=/tmp" >> "$GITHUB_ENV"

      - name: Build updated ISO
        working-directory: build
        run: sudo lb build

      # Gate the artifact on the payload actually being in the image. The
      # squashfs is unpacked on the runner (squashfs-tools is installed above)
      # and the build FAILS if /usr/lib/raptor-security is absent — there is no
      # way to publish a "successful" weekly update that silently lost its
      # customization layer. build-iso.yml has had this gate since the payload
      # went missing once; this workflow never got it, so the update run would
      # happily publish a hollow ISO.
      - name: Assert Raptor payload is packed into the image
        working-directory: build
        run: |
          set -e
          SQ="binary/live/filesystem.squashfs"
          [ -f "$SQ" ] || { echo "ERROR: $SQ not found"; ls -la binary/live/ 2>/dev/null; exit 1; }
          if ! unsquashfs -n -ll "$SQ" 2>/dev/null | grep -q 'raptor-firstboot'; then
            echo "ERROR: Raptor payload MISSING from the image — includes.chroot did not make it in."
            echo "Top of squashfs listing for reference:"
            unsquashfs -n -ll "$SQ" 2>/dev/null | head -20
            exit 1
          fi
          echo "payload OK: raptor-firstboot.sh is in the image"
          unsquashfs -n -ll "$SQ" 2>/dev/null | grep -c 'usr/lib/raptor-security' | sed 's/^/raptor-security paths: /'
          echo "panel config:"
          unsquashfs -n -ll "$SQ" 2>/dev/null | grep 'xfce4-panel.xml' || echo "WARNING: custom panel config absent (default XFCE panel used)"
          echo "system-wide (xdg) xfce defaults:"
          unsquashfs -n -ll "$SQ" 2>/dev/null | grep -E 'etc/xdg/xfce4/xfconf/xfce-perchannel-xml/(xfce4-panel|xfce4-desktop|xsettings)\.xml' || echo "WARNING: /etc/xdg xfce defaults absent — desktop may fall back to Debian defaults"
          echo "wallpaper:"
          unsquashfs -n -ll "$SQ" 2>/dev/null | grep 'backgrounds/raptor-dark.png' || echo "WARNING: custom wallpaper absent"
          echo "lightdm autologin:"
          unsquashfs -n -ll "$SQ" 2>/dev/null | grep 'lightdm.conf.d/80-raptor-autologin.conf' || echo "WARNING: lightdm autologin config absent"
          echo "boot report instrumentation:"
          unsquashfs -n -ll "$SQ" 2>/dev/null | grep -E 'raptor-boot-report(\.sh|\.desktop)' || echo "WARNING: boot report instrument not found"

      - name: Verify ISO
        working-directory: build
        run: |
          set -e
          ISO="$(find . -maxdepth 1 -type f -name '*.iso' -print -quit)"
          if [ -z "$ISO" ]; then
            echo "ERROR: live-build completed but no ISO was produced."
            exit 1
          fi
          echo "Raptor OS Security build succeeded (BIOS-only at this point):"
          ls -lh "$ISO"

      # Same fix as build-iso.yml — see that workflow's comment for the
      # full explanation and how each piece was tested before being
      # added here.
      - name: Add UEFI boot support (BIOS boot untouched)
        working-directory: build
        run: |
          set -e

          ORIGINAL_ISO="$(find . -maxdepth 1 -type f -name '*.iso' -print -quit)"
          echo "Original BIOS-only ISO: $ORIGINAL_ISO"

          # Same fix as build-iso.yml — see that workflow's comment for
          # the full explanation.
          sudo chmod -R a+rwX binary "$ORIGINAL_ISO"

          mkdir -p efi-build

          # Resolve the real initramfs name so grub.cfg points at a file that
          # exists (live-build names it initrd.img or initrd.img-<kver>). A
          # wrong name boots the kernel with no initramfs and panics with
          # "VFS: Unable to mount root fs on unknown-block(0,0)".
          INITRD_NAME="$(ls binary/live/initrd.img* 2>/dev/null | sed 's#^binary/##' | head -1 || true)"
          if [ -z "$INITRD_NAME" ]; then
            echo "ERROR: no initramfs found under binary/live/ — the ISO would be unbootable" >&2
            ls -la binary/live/ 2>/dev/null || ls -la binary/ || true
            exit 1
          fi
          echo "Using initrd: /$INITRD_NAME"
          {
            printf '%s\n' 'insmod part_gpt'
            printf '%s\n' 'insmod part_msdos'
            printf '%s\n' 'insmod fat'
            printf '%s\n' 'insmod iso9660'
            printf '%s\n' 'insmod all_video'
            printf '%s\n' 'insmod gfxterm'
            printf '%s\n' 'insmod search'
            printf '%s\n' 'insmod search_fs_uuid'
            printf '%s\n' 'insmod search_label'
            printf '%s\n' 'insmod regexp'
            printf '\n'
            printf '%s\n' 'set default="0"'
            printf '%s\n' 'set timeout=0'
            printf '\n'
            printf '%s\n' 'search --no-floppy --set=root --label RAPTOR-SECURITY'
            printf '\n'
            printf '%s\n' 'menuentry "Raptor Security (Live)" {'
            printf '%s\n' '    linux /live/vmlinuz boot=live config components username=user autologin quiet loglevel=3 ignore_uuid live-media-timeout=30 init_on_alloc=1 init_on_free=1 slab_nomerge page_poison=1 vsyscall=emulate oops=panic panic=30'
            printf '%s\n' "    initrd /$INITRD_NAME"
            printf '%s\n' '}'
            printf '\n'
            printf '%s\n' 'menuentry "Raptor Security (Live, fail-safe)" {'
            printf '%s\n' '    linux /live/vmlinuz boot=live config components username=user autologin quiet loglevel=3 ignore_uuid live-media-timeout=30 init_on_alloc=1 init_on_free=1 slab_nomerge page_poison=1 vsyscall=emulate oops=panic panic=30 noapic noapm nodma nomce nolapic nosmp'
            printf '%s\n' "    initrd /$INITRD_NAME"
            printf '%s\n' '}'
          } > efi-build/grub.cfg

          grub-mkstandalone \
            --format=x86_64-efi \
            --output=efi-build/BOOTX64.EFI \
            --locales="" \
            --fonts="" \
            "boot/grub/grub.cfg=efi-build/grub.cfg"

          file efi-build/BOOTX64.EFI | grep -q "PE32+ executable" || {
            echo "ERROR: grub-mkstandalone did not produce a valid EFI executable"
            exit 1
          }

          mkdir -p efi-build/esp/EFI/BOOT
          cp efi-build/BOOTX64.EFI efi-build/esp/EFI/BOOT/BOOTX64.EFI
          dd if=/dev/zero of=efi-build/efiboot.img bs=1M count=16
          mkfs.vfat -F 16 -n "RAPTOR_EFI" efi-build/efiboot.img
          mmd -i efi-build/efiboot.img ::/EFI
          mmd -i efi-build/efiboot.img ::/EFI/BOOT
          mcopy -i efi-build/efiboot.img efi-build/BOOTX64.EFI ::/EFI/BOOT/BOOTX64.EFI

          mkdir -p binary/EFI/BOOT
          cp efi-build/BOOTX64.EFI binary/EFI/BOOT/BOOTX64.EFI

          cd binary
          xorriso -as mkisofs \
            -r -J -l -cache-inodes -allow-multidot \
            -A "Raptor Security" \
            -publisher "Raptor OS Project" \
            -V "RAPTOR-SECURITY" \
            -no-emul-boot -boot-load-size 4 -boot-info-table \
            -b isolinux/isolinux.bin -c isolinux/boot.cat \
            -eltorito-alt-boot \
            -e --interval:appended_partition_2:all:: \
            -no-emul-boot \
            -append_partition 2 0xef ../efi-build/efiboot.img \
            -isohybrid-gpt-basdat \
            -o "../${ORIGINAL_ISO}.uefi" \
            .
          cd ..

          ENTRY_COUNT=$(xorriso -indev "${ORIGINAL_ISO}.uefi" -report_el_torito plain 2>&1 | grep -c "El Torito boot img" || true)
          if [ "$ENTRY_COUNT" -lt 2 ]; then
            echo "ERROR: rebuilt ISO does not have both BIOS and UEFI boot entries."
            echo "Falling back to the original BIOS-only ISO — nothing is lost, UEFI just isn't added this run."
            rm -f "${ORIGINAL_ISO}.uefi"
          else
            echo "Confirmed: rebuilt ISO has both BIOS and UEFI boot entries."
            xorriso -indev "${ORIGINAL_ISO}.uefi" -report_el_torito plain 2>&1 | grep "El Torito boot img"
            mv "${ORIGINAL_ISO}.uefi" "$ORIGINAL_ISO"
          fi

      # live-build writes the image as binary.hybrid.iso regardless of
      # project naming. Give weekly updates a dated, product-named file so a
      # published update is identifiable by date and can never be confused
      # with the previous week's ISO (Internet Archive items are immutable —
      # a given identifier can only be created once, so each build genuinely
      # needs its own dated identifier).
      - name: Rename ISO to product name
        working-directory: build
        run: |
          set -e
          ISO="$(find . -maxdepth 1 -type f -name '*.iso' -print -quit)"
          [ -n "$ISO" ] || { echo "ERROR: no ISO found to rename."; exit 1; }
          DATE="$(date -u +%Y%m%d)"
          FINAL="raptor-security-${DATE}.iso"
          # A second ISO here means `find -print -quit` may have handed us the
          # wrong one; refuse rather than ship a renamed stale image.
          COUNT="$(find . -maxdepth 1 -type f -name '*.iso' | wc -l)"
          if [ "$COUNT" -ne 1 ]; then
            echo "ERROR: expected exactly 1 ISO before rename, found $COUNT:"
            find . -maxdepth 1 -type f -name '*.iso'
            exit 1
          fi
          mv "$ISO" "$FINAL"
          echo "Renamed to: $FINAL"
          ls -lh "$FINAL"

      - name: Compute checksum
        working-directory: build
        run: |
          set -e
          ISO="$(find . -maxdepth 1 -type f -name '*.iso' -print -quit)"
          echo "Final ISO:"
          ls -lh "$ISO"
          sha256sum "$ISO" > raptor-security.sha256
          cat raptor-security.sha256

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: Raptor-OS-Security-Update
          path: |
            build/*.iso
            build/raptor-security.sha256
          compression-level: 0
          retention-days: 30

      # The artifact alone is not an update: nobody can install a 30-day-old
      # GitHub artifact, and this workflow's entire reason to exist is getting
      # upstream Debian security fixes in front of users. Publish to the same
      # Internet Archive collection the README points at, using the official
      # `ia` CLI so no upload endpoint is hand-rolled here.
      #
      # Gated on the IA_* secrets actually being configured — a fork or a
      # maintainer without credentials still gets a green build and a usable
      # artifact rather than a hard failure at the last step.
      #
      # NOTE: `secrets` cannot be referenced inside an `if:` expression
      # (GitHub rejects it at workflow-parse time with "Unrecognized
      # named-value: 'secrets'", which fails the whole run with zero jobs
      # before anything starts). Secrets ARE available in `env`, so the gate
      # is computed into an output here and consumed as `steps.*.outputs.*`.
      - name: Compute IA publish gate
        id: ia-gate
        env:
          IA_COLLECTION: ${{ vars.IA_COLLECTION }}
          IA_KEY: ${{ secrets.IA_KEY }}
          IA_SECRET: ${{ secrets.IA_SECRET }}
        run: |
          if [ -n "${IA_COLLECTION:-}" ] && [ -n "${IA_KEY:-}" ] && [ -n "${IA_SECRET:-}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish update to Internet Archive
        if: steps.ia-gate.outputs.enabled == 'true'
        working-directory: build
        env:
          IA_KEY: ${{ secrets.IA_KEY }}
          IA_SECRET: ${{ secrets.IA_SECRET }}
          COLLECTION: ${{ vars.IA_COLLECTION }}
        run: |
          set -e
          pip3 install --quiet --disable-pip-version-check internetarchive

          ISO="$(find . -maxdepth 1 -type f -name '*.iso' -print -quit)"
          STAMP="$(date -u +%Y%m%d)"
          IDENTIFIER="raptor-os-security-${STAMP}"

          echo "Publishing ${ISO} as ${IDENTIFIER} to collection ${COLLECTION}"
          ia upload "$IDENTIFIER" "$ISO" raptor-security.sha256 \
            --collection "$COLLECTION" \
            --no-retries \
            --log "$RUNNER_TEMP/ia-upload.log"
          echo "Published: $IDENTIFIER"

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: raptor-update-diagnostics
          path: |
            build/cache/*.log
            build/cache/**/apt.log
            build/config/auto/
            ${{ runner.temp }}/ia-upload.log
          if-no-files-found: ignore
          retention-days: 14

      # Same fix as build-iso.yml — see that workflow's comment for the
      # full explanation.
      - name: Fix cache permissions for save
        if: always()
        run: sudo chmod -R a+rX build/cache 2>/dev/null || true
