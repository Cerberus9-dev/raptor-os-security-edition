# Raptor OS — NetworkManager hardening defaults.
#
# dns=none: NetworkManager must never rewrite /etc/resolv.conf. Raptor's own
# dnsmasq (127.0.0.1:53 -> Tor DNSPort) is the resolver of record; if NM owned
# DNS it would clobber the nameserver with the uplink's clearnet DNS and leak
# every lookup.
#
# MAC randomization: every new connection gets a fresh randomized MAC and
# every wifi scan uses a different MAC, so the OS does not broadcast a stable
# hardware identity on probe/public networks. Per-mode nft/sysctl hardening is
# layered on top by Mode Manager.
[main]
dns=none

[connection]
ethernet.cloned-mac-address=random
wifi.cloned-mac-address=random
wifi.scan-rand-mac-address=yes

[device]
wifi.scan-rand-mac-address=yes