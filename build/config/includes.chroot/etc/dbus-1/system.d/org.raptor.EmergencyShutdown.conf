<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.raptor.EmergencyShutdown"/>
    <allow send_destination="org.raptor.EmergencyShutdown"
           send_interface="org.freedesktop.DBus.Introspectable" send_member="Introspect"/>
    <allow send_destination="org.raptor.EmergencyShutdown"
           send_interface="org.freedesktop.DBus.Peer" send_member="Ping"/>
    <allow send_destination="org.raptor.EmergencyShutdown"
           send_interface="org.freedesktop.DBus.Properties" send_member="Get"/>
    <allow send_destination="org.raptor.EmergencyShutdown"
           send_interface="org.freedesktop.DBus.Properties" send_member="GetAll"/>

  </policy>

  <!-- Any logged-in user can query what will/won't be preserved — this
       has to be readable pre-confirmation so the dialog text is accurate. -->
  <policy context="default">
    <allow send_destination="org.raptor.EmergencyShutdown"
           send_interface="org.freedesktop.DBus.Introspectable" send_member="Introspect"/>
    <allow send_destination="org.raptor.EmergencyShutdown"
           send_interface="org.freedesktop.DBus.Peer" send_member="Ping"/>
    <allow send_destination="org.raptor.EmergencyShutdown"
           send_interface="org.freedesktop.DBus.Properties" send_member="Get"/>
    <allow send_destination="org.raptor.EmergencyShutdown"
           send_interface="org.freedesktop.DBus.Properties" send_member="GetAll"/>

    <allow send_destination="org.raptor.EmergencyShutdown"
           send_interface="org.raptor.EmergencyShutdown1"
           send_member="GetPersistenceInfo"/>
  </policy>

  <!--
    TriggerEmergencyShutdown is restricted to raptor-admin, same rationale
    and same TODO (real polkit, not a group check) as ModeManager's
    SetMode. Emergency Shutdown is a MORE destructive action than a mode
    change, not less — do not loosen this policy before ModeManager's is
    fixed; if anything it should get the stricter treatment first.
  -->
  <policy group="raptor-admin">
    <allow send_destination="org.raptor.EmergencyShutdown"
           send_interface="org.freedesktop.DBus.Introspectable" send_member="Introspect"/>
    <allow send_destination="org.raptor.EmergencyShutdown"
           send_interface="org.freedesktop.DBus.Peer" send_member="Ping"/>
    <allow send_destination="org.raptor.EmergencyShutdown"
           send_interface="org.freedesktop.DBus.Properties" send_member="Get"/>
    <allow send_destination="org.raptor.EmergencyShutdown"
           send_interface="org.freedesktop.DBus.Properties" send_member="GetAll"/>

    <allow send_destination="org.raptor.EmergencyShutdown"
           send_interface="org.raptor.EmergencyShutdown1"
           send_member="TriggerEmergencyShutdown"/>
  </policy>
</busconfig>
