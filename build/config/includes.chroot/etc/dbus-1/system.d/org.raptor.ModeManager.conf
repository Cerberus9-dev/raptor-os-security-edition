<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- root owns the service -->
  <policy user="root">
    <allow own="org.raptor.ModeManager"/>
    <allow send_destination="org.raptor.ModeManager"
           send_interface="org.freedesktop.DBus.Introspectable" send_member="Introspect"/>
    <allow send_destination="org.raptor.ModeManager"
           send_interface="org.freedesktop.DBus.Peer" send_member="Ping"/>
    <allow send_destination="org.raptor.ModeManager"
           send_interface="org.freedesktop.DBus.Properties" send_member="Get"/>
    <allow send_destination="org.raptor.ModeManager"
           send_interface="org.freedesktop.DBus.Properties" send_member="GetAll"/>

  </policy>

  <!-- Everyone can read status (GetStatus/GetMode) and receive signals —
       the dashboard needs this for any logged-in user. -->
  <policy context="default">
    <allow send_destination="org.raptor.ModeManager"
           send_interface="org.freedesktop.DBus.Introspectable" send_member="Introspect"/>
    <allow send_destination="org.raptor.ModeManager"
           send_interface="org.freedesktop.DBus.Peer" send_member="Ping"/>
    <allow send_destination="org.raptor.ModeManager"
           send_interface="org.freedesktop.DBus.Properties" send_member="Get"/>
    <allow send_destination="org.raptor.ModeManager"
           send_interface="org.freedesktop.DBus.Properties" send_member="GetAll"/>

    <allow send_destination="org.raptor.ModeManager"
           send_interface="org.raptor.ModeManager1"
           send_member="GetStatus"/>
    <allow send_destination="org.raptor.ModeManager"
           send_interface="org.raptor.ModeManager1"
           send_member="GetMode"/>
    <allow receive_sender="org.raptor.ModeManager"/>
  </policy>

  <!--
    SetMode is restricted to members of the 'raptor-admin' group.

    TODO before this ships: replace this coarse group check with a real
    polkit action (org.raptor.modemanager.setmode) so mode changes prompt
    for authentication like any other privileged desktop action, rather
    than being silently allowed for any process running as a group member.
    A D-Bus system.d group policy is a placeholder, not the final design —
    flagging explicitly rather than letting this look more finished than
    it is.
  -->
  <policy group="raptor-admin">
    <allow send_destination="org.raptor.ModeManager"
           send_interface="org.freedesktop.DBus.Introspectable" send_member="Introspect"/>
    <allow send_destination="org.raptor.ModeManager"
           send_interface="org.freedesktop.DBus.Peer" send_member="Ping"/>
    <allow send_destination="org.raptor.ModeManager"
           send_interface="org.freedesktop.DBus.Properties" send_member="Get"/>
    <allow send_destination="org.raptor.ModeManager"
           send_interface="org.freedesktop.DBus.Properties" send_member="GetAll"/>

    <allow send_destination="org.raptor.ModeManager"
           send_interface="org.raptor.ModeManager1"
           send_member="SetMode"/>
  </policy>
</busconfig>
