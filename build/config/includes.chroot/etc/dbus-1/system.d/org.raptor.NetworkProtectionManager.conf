<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.raptor.NetworkProtectionManager"/>
    <allow send_destination="org.raptor.NetworkProtectionManager"
           send_interface="org.freedesktop.DBus.Introspectable" send_member="Introspect"/>
    <allow send_destination="org.raptor.NetworkProtectionManager"
           send_interface="org.freedesktop.DBus.Peer" send_member="Ping"/>
    <allow send_destination="org.raptor.NetworkProtectionManager"
           send_interface="org.freedesktop.DBus.Properties" send_member="Get"/>
    <allow send_destination="org.raptor.NetworkProtectionManager"
           send_interface="org.freedesktop.DBus.Properties" send_member="GetAll"/>

  </policy>

  <policy context="default">
    <allow send_destination="org.raptor.NetworkProtectionManager"
           send_interface="org.freedesktop.DBus.Introspectable" send_member="Introspect"/>
    <allow send_destination="org.raptor.NetworkProtectionManager"
           send_interface="org.freedesktop.DBus.Peer" send_member="Ping"/>
    <allow send_destination="org.raptor.NetworkProtectionManager"
           send_interface="org.freedesktop.DBus.Properties" send_member="Get"/>
    <allow send_destination="org.raptor.NetworkProtectionManager"
           send_interface="org.freedesktop.DBus.Properties" send_member="GetAll"/>

    <allow send_destination="org.raptor.NetworkProtectionManager"
           send_interface="org.raptor.NetworkProtectionManager1"
           send_member="GetStatus"/>
    <allow send_destination="org.raptor.NetworkProtectionManager"
           send_interface="org.raptor.NetworkProtectionManager1"
           send_member="ListOpenPorts"/>
  </policy>

  <policy group="raptor-admin">
    <allow send_destination="org.raptor.NetworkProtectionManager"
           send_interface="org.freedesktop.DBus.Introspectable" send_member="Introspect"/>
    <allow send_destination="org.raptor.NetworkProtectionManager"
           send_interface="org.freedesktop.DBus.Peer" send_member="Ping"/>
    <allow send_destination="org.raptor.NetworkProtectionManager"
           send_interface="org.freedesktop.DBus.Properties" send_member="Get"/>
    <allow send_destination="org.raptor.NetworkProtectionManager"
           send_interface="org.freedesktop.DBus.Properties" send_member="GetAll"/>

    <allow send_destination="org.raptor.NetworkProtectionManager"
           send_interface="org.raptor.NetworkProtectionManager1"
           send_member="SetMACRandomization"/>
    <allow send_destination="org.raptor.NetworkProtectionManager"
           send_interface="org.raptor.NetworkProtectionManager1"
           send_member="SetIPv6Enabled"/>
  </policy>
</busconfig>
