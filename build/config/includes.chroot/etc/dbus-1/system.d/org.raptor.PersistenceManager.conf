<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.raptor.PersistenceManager"/>
    <allow send_destination="org.raptor.PersistenceManager"
           send_interface="org.freedesktop.DBus.Introspectable" send_member="Introspect"/>
    <allow send_destination="org.raptor.PersistenceManager"
           send_interface="org.freedesktop.DBus.Peer" send_member="Ping"/>
    <allow send_destination="org.raptor.PersistenceManager"
           send_interface="org.freedesktop.DBus.Properties" send_member="Get"/>
    <allow send_destination="org.raptor.PersistenceManager"
           send_interface="org.freedesktop.DBus.Properties" send_member="GetAll"/>

  </policy>

  <!-- Status and the candidate-device list are read-only and safe for any
       logged-in user — Security Center's dashboard and Mode/Emergency
       Shutdown Managers all need to read this without being admins. -->
  <policy context="default">
    <allow send_destination="org.raptor.PersistenceManager"
           send_interface="org.freedesktop.DBus.Introspectable" send_member="Introspect"/>
    <allow send_destination="org.raptor.PersistenceManager"
           send_interface="org.freedesktop.DBus.Peer" send_member="Ping"/>
    <allow send_destination="org.raptor.PersistenceManager"
           send_interface="org.freedesktop.DBus.Properties" send_member="Get"/>
    <allow send_destination="org.raptor.PersistenceManager"
           send_interface="org.freedesktop.DBus.Properties" send_member="GetAll"/>

    <allow send_destination="org.raptor.PersistenceManager"
           send_interface="org.raptor.PersistenceManager1"
           send_member="GetStatus"/>
    <allow send_destination="org.raptor.PersistenceManager"
           send_interface="org.raptor.PersistenceManager1"
           send_member="ListCandidateDevices"/>
  </policy>

  <!--
    CreatePersistence is destructive (wipes a whole disk) — restricted to
    raptor-admin, same TODO-to-polkit as the other managers. This one
    especially should not ship to any real release gated only by group
    membership; a mis-clicked device path with this policy as the only
    gate is a real data-loss risk, not a hypothetical one.
  -->
  <policy group="raptor-admin">
    <allow send_destination="org.raptor.PersistenceManager"
           send_interface="org.freedesktop.DBus.Introspectable" send_member="Introspect"/>
    <allow send_destination="org.raptor.PersistenceManager"
           send_interface="org.freedesktop.DBus.Peer" send_member="Ping"/>
    <allow send_destination="org.raptor.PersistenceManager"
           send_interface="org.freedesktop.DBus.Properties" send_member="Get"/>
    <allow send_destination="org.raptor.PersistenceManager"
           send_interface="org.freedesktop.DBus.Properties" send_member="GetAll"/>

    <allow send_destination="org.raptor.PersistenceManager"
           send_interface="org.raptor.PersistenceManager1"
           send_member="CreatePersistence"/>
  </policy>
</busconfig>
