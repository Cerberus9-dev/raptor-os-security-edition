<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.raptor.VPNManager"/>
    <allow send_destination="org.raptor.VPNManager"
           send_interface="org.freedesktop.DBus.Introspectable" send_member="Introspect"/>
    <allow send_destination="org.raptor.VPNManager"
           send_interface="org.freedesktop.DBus.Peer" send_member="Ping"/>
    <allow send_destination="org.raptor.VPNManager"
           send_interface="org.freedesktop.DBus.Properties" send_member="Get"/>
    <allow send_destination="org.raptor.VPNManager"
           send_interface="org.freedesktop.DBus.Properties" send_member="GetAll"/>

  </policy>

  <!-- Status and profile listing are read-only. -->
  <policy context="default">
    <allow send_destination="org.raptor.VPNManager"
           send_interface="org.freedesktop.DBus.Introspectable" send_member="Introspect"/>
    <allow send_destination="org.raptor.VPNManager"
           send_interface="org.freedesktop.DBus.Peer" send_member="Ping"/>
    <allow send_destination="org.raptor.VPNManager"
           send_interface="org.freedesktop.DBus.Properties" send_member="Get"/>
    <allow send_destination="org.raptor.VPNManager"
           send_interface="org.freedesktop.DBus.Properties" send_member="GetAll"/>

    <allow send_destination="org.raptor.VPNManager"
           send_interface="org.raptor.VPNManager1"
           send_member="GetStatus"/>
    <allow send_destination="org.raptor.VPNManager"
           send_interface="org.raptor.VPNManager1"
           send_member="ListProfiles"/>
  </policy>

  <!--
    Connect/Disconnect/ImportProfile are gated the same way as every other
    manager's state-changing methods (raptor-admin group, TODO: polkit).
    Unlike CreatePersistence or SetMode, connecting/disconnecting a VPN is
    a routine action a normal user would want to do often — the group
    gate here is mainly for consistency with the rest of the system, not
    because Connect/Disconnect are especially dangerous. Worth revisiting
    whether these specifically deserve a lighter-weight polkit action
    (auth_admin_keep or similar) than SetMode/CreatePersistence once
    polkit is actually wired in.
  -->
  <policy group="raptor-admin">
    <allow send_destination="org.raptor.VPNManager"
           send_interface="org.freedesktop.DBus.Introspectable" send_member="Introspect"/>
    <allow send_destination="org.raptor.VPNManager"
           send_interface="org.freedesktop.DBus.Peer" send_member="Ping"/>
    <allow send_destination="org.raptor.VPNManager"
           send_interface="org.freedesktop.DBus.Properties" send_member="Get"/>
    <allow send_destination="org.raptor.VPNManager"
           send_interface="org.freedesktop.DBus.Properties" send_member="GetAll"/>

    <allow send_destination="org.raptor.VPNManager"
           send_interface="org.raptor.VPNManager1"
           send_member="Connect"/>
    <allow send_destination="org.raptor.VPNManager"
           send_interface="org.raptor.VPNManager1"
           send_member="Disconnect"/>
    <allow send_destination="org.raptor.VPNManager"
           send_interface="org.raptor.VPNManager1"
           send_member="ImportProfile"/>
  </policy>
</busconfig>
