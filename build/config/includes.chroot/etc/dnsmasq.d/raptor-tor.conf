# Raptor OS — DNS over Tor.
# Local resolver forwarding every query to Tor's DNSPort (9053). Mode Manager
# points /etc/resolv.conf at 127.0.0.1 once Tor + this resolver are running
# (secure/hardened), so application DNS never touches the clearnet.
# Lockdown stops this service as part of severing the network.
port=53
listen-address=127.0.0.1
bind-interfaces
no-resolv
no-poll
no-hosts
server=127.0.0.1#9053
domain-needed
bogus-priv
log-queries=extra
log-facility=/var/log/dnsmasq.log
cache-size=1000
no-dhcp-interface=