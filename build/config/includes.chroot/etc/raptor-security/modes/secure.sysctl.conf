# Secure mode: baseline posture already in 99-raptor-hardening.conf.
# Add source-route/redirect hardening here so a mode switch re-applies it
# even if 99-raptor-hardening.conf is not present in the image.
net.ipv4.conf.all.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv4.conf.all.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0