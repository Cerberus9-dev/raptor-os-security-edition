# Raptor OS — DNS over Tor.
# Boot-time pointing so applications resolving before Mode Manager runs
# (first logon, panel scripts) never leak queries onto the clearnet.
# NetworkManager is configured dns=none so it does not overwrite this;
# Mode Manager (re)writes this file on every mode switch to keep the
# loopback resolver authoritative, and stops dnsmasq in lockdown.
nameserver 127.0.0.1