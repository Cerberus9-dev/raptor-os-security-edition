# Prevent SYN flood attacks
net.ipv4.tcp_syncookies = 1

# Ignore ICMP echo requests (stealth mode against ping scans)
net.ipv4.icmp_echo_ignore_all = 1
net.ipv6.icmp.echo_ignore_all = 1

# Disable IP source routing and ICMP redirects (prevents MITM/routing attacks)
net.ipv4.conf.all.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv4.conf.all.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0

# Reverse path filtering (prevents IP spoofing)
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# Memory protection against kernel exploits
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1

# Crash behaviour: panic instead of limp, and reboot with a guard so a
# crashed kernel can't silently hang the machine during a live session.
kernel.panic_on_oops = 1
kernel.panic = 30

# Core dumps: keep them out of the world (they can hold secrets), and at
# most a single dump per executable.
fs.suid_dumpable = 0
kernel.core_uses_pid = 1
