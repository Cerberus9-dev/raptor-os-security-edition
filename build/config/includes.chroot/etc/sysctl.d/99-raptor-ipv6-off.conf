# Raptor OS — IPv6 disabled by default.
# IPv6 egress that bypasses Tor is a classic leak vector on a privacy
# OS (the nft rulesets govern the inet family, but a mode's "accept"
# egress would happily pass v6 traffic on the clearnet). Kodachi-style
# systems disable v6 at the route level; Network Protection Manager's
# SetIPv6Enabled(True) re-enables it at runtime for users who need it.
net.ipv6.conf.all.disable_ipv6 = 1
net.ipv6.conf.default.disable_ipv6 = 1