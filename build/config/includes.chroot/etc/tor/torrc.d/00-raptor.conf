# Enable Transparent Proxying & Local DNS
VirtualAddrNetworkIPv4 10.192.0.0/10
AutomapHostsOnResolve 1
TransPort 127.0.0.1:9040
DNSPort 127.0.0.1:9053

# Enable Local Control Port for 'New Identity' Signals
# Cookie auth (not a fixed password) so no secret needs to be baked into
# the image/daemon — matches raptor-torrc-addition.conf. CookieAuthentication
# must stay enabled for raptor-tor-managerd's NewIdentity() to work.
ControlPort 127.0.0.1:9051
CookieAuthentication 1
CookieAuthFileGroupReadable 1
